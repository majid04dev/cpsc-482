<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vote cards v2 (same bird and motion as the story design)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#F6F1E7;overflow:hidden}
.row{display:grid;grid-template-columns:repeat(5,216px);gap:10px;height:100%;padding:2px 0}
.card{position:relative;border:1.5px solid #DDD4C3;border-radius:12px;background:rgba(255,255,255,.53)}
.card svg{position:absolute;left:50%;top:40px;width:70px;height:46px;margin-left:-35px;overflow:visible}
@keyframes bobb{50%{transform:translateY(-3px)}}
.bob{animation:bobb 1.6s ease-in-out infinite}
@keyframes note{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(10px,-22px);opacity:0}}
.note1{animation:note 2s infinite}.note2{animation:note 2s .7s infinite}
</style></head><body>
<div class="row">
<div class="card"><svg viewBox="0 0 70 46"><g transform="translate(35,27)"><path d="M-50 22 Q0 16 50 24" stroke="#A88F6B" stroke-width="3" fill="none" stroke-linecap="round"/><g class="bob"><g transform="translate(0,8) scale(1,1)"><path d="M-16 4 C-16 -5 -9 -11 -1 -11 C2 -16 9 -16 11 -11 L17 -9 L11 -7 C12 1 7 8 -2 9 L-12 14 L-10 8 C-14 8 -16 6 -16 4 Z" fill="#4F64A8"/><circle cx="6" cy="-10" r="1.6" fill="#F6F1E7"/></g></g><text class="note1" x="16" y="-8" font-size="13" fill="#4F64A8">&#9834;</text><text class="note2" x="22" y="-2" font-size="11" fill="#4F64A8">&#9835;</text></g></svg></div>
<div class="card"><svg viewBox="0 0 70 46"><g transform="translate(35,27)"><path d="M-50 22 Q0 16 50 24" stroke="#A88F6B" stroke-width="3" fill="none" stroke-linecap="round"/><g class="bob"><g transform="translate(0,8) scale(1,1)"><path d="M-16 4 C-16 -5 -9 -11 -1 -11 C2 -16 9 -16 11 -11 L17 -9 L11 -7 C12 1 7 8 -2 9 L-12 14 L-10 8 C-14 8 -16 6 -16 4 Z" fill="#D9733B"/><circle cx="6" cy="-10" r="1.6" fill="#F6F1E7"/></g></g><text class="note1" x="16" y="-8" font-size="13" fill="#D9733B">&#9834;</text><text class="note2" x="22" y="-2" font-size="11" fill="#D9733B">&#9835;</text></g></svg></div>
<div class="card"><svg viewBox="0 0 70 46"><g transform="translate(35,27)"><path d="M-50 22 Q0 16 50 24" stroke="#A88F6B" stroke-width="3" fill="none" stroke-linecap="round"/><g class="bob"><g transform="translate(0,8) scale(1,1)"><path d="M-16 4 C-16 -5 -9 -11 -1 -11 C2 -16 9 -16 11 -11 L17 -9 L11 -7 C12 1 7 8 -2 9 L-12 14 L-10 8 C-14 8 -16 6 -16 4 Z" fill="#7B5A3A"/><circle cx="6" cy="-10" r="1.6" fill="#F6F1E7"/></g></g><text class="note1" x="16" y="-8" font-size="13" fill="#7B5A3A">&#9834;</text><text class="note2" x="22" y="-2" font-size="11" fill="#7B5A3A">&#9835;</text></g></svg></div>
<div class="card"><svg viewBox="0 0 70 46"><g transform="translate(35,27)"><path d="M-50 22 Q0 16 50 24" stroke="#A88F6B" stroke-width="3" fill="none" stroke-linecap="round"/><g class="bob"><g transform="translate(0,8) scale(1,1)"><path d="M-16 4 C-16 -5 -9 -11 -1 -11 C2 -16 9 -16 11 -11 L17 -9 L11 -7 C12 1 7 8 -2 9 L-12 14 L-10 8 C-14 8 -16 6 -16 4 Z" fill="#2E7D6B"/><circle cx="6" cy="-10" r="1.6" fill="#F6F1E7"/></g></g><text class="note1" x="16" y="-8" font-size="13" fill="#2E7D6B">&#9834;</text><text class="note2" x="22" y="-2" font-size="11" fill="#2E7D6B">&#9835;</text></g></svg></div>
<div class="card"><svg viewBox="0 0 70 46"><g transform="translate(35,27)"><path d="M-50 22 Q0 16 50 24" stroke="#A88F6B" stroke-width="3" fill="none" stroke-linecap="round"/><g class="bob"><g transform="translate(0,8) scale(1,1)"><path d="M-16 4 C-16 -5 -9 -11 -1 -11 C2 -16 9 -16 11 -11 L17 -9 L11 -7 C12 1 7 8 -2 9 L-12 14 L-10 8 C-14 8 -16 6 -16 4 Z" fill="#4FAFD8"/><circle cx="6" cy="-10" r="1.6" fill="#F6F1E7"/></g></g><text class="note1" x="16" y="-8" font-size="13" fill="#4FAFD8">&#9834;</text><text class="note2" x="22" y="-2" font-size="11" fill="#4FAFD8">&#9835;</text></g></svg></div>
</div></body></html>
