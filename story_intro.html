<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intro – Five birds ran for Canada's national bird</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{--paper:#F6F1E7;--paper2:#EFE8DA;--ink:#24211C;--muted:#857D70;--line:#DDD4C3;--e0:#DCD5C7;--e1:#BDB4A3;--e2:#8F8778;
  --gj:#4F64A8;--bc:#D9733B;--cg:#7B5A3A;--cl:#2E7D6B;--so:#4FAFD8}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 16px/1.45 "Work Sans",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(120,100,70,.08) 1px,transparent 1px);background-size:5px 5px}
section{position:relative;min-height:100vh;padding:10vh 6vw 7vh;display:flex;flex-direction:column;justify-content:center}
.wrap{max-width:1140px;margin:0 auto;width:100%}
.case{font:600 12.5px "Work Sans";letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.9rem;display:flex;align-items:center;gap:.7em}
.case b{font:800 13px "Work Sans";color:var(--paper);background:var(--ink);border-radius:20px;padding:2px 9px;letter-spacing:.1em}
h1,h2{font-family:"Fraunces",serif;font-weight:800;letter-spacing:-.02em;line-height:1.03}
h1{font-size:clamp(42px,6.6vw,96px)}
h2{font-size:clamp(28px,3.9vw,52px);max-width:24ch;margin-bottom:.5rem}
.sub{font-size:clamp(15px,1.45vw,18.5px);color:var(--muted);max-width:56ch}
.note{font-size:12.5px;color:var(--muted);max-width:76ch;margin-top:1rem}
.note b{color:var(--ink)}
.flag{display:inline-block;font:600 10.5px "Work Sans";letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--muted);border-radius:3px;padding:1px 5px;margin-right:6px}
.c-gj{color:var(--gj)}.c-so{color:var(--so)}
.pill{border:1.5px solid var(--ink);background:transparent;border-radius:30px;padding:6px 13px;font:500 14px "Work Sans";cursor:pointer;color:var(--ink)}
.pill.on{background:var(--ink);color:var(--paper)}
.pill:hover{transform:translateY(-1px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;padding:8px 11px;border-radius:6px;opacity:0;transition:opacity .15s;z-index:30;max-width:270px;line-height:1.35}
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s}
.in .rv{opacity:1;transform:none}.in .d1{transition-delay:.15s}.in .d2{transition-delay:.3s}.in .d3{transition-delay:.45s}
nav{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:12px}
nav a{font:800 13px "Work Sans";color:var(--line);text-decoration:none;text-align:center;transition:.3s;width:30px;height:30px;line-height:28px;border:1.5px solid currentColor;border-radius:50%}
nav a.on{color:var(--ink)}
/* hero */
#flock{width:100%;height:min(46vh,380px);margin:2vh 0 1vh;overflow:visible}
#flock .fin{cursor:pointer}
.scroll{font-size:13px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(6px)}}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(14px,-8px)}100%{transform:translate(0,0)}}
/* ladder */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:1.2rem 0 .6rem}
.step{border:1.5px solid var(--line);background:#fff6;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;transition:.25s;font-family:inherit;color:inherit}
.step svg{width:64px;height:50px;overflow:visible}
.step b{display:block;font:600 14.5px "Work Sans"}
.step small{font-size:12px;color:var(--muted);line-height:1.25;display:block}
.step.on{border-color:var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink)}
.step.past{border-color:var(--e1)}
#ladder{width:100%;height:440px;display:block}
.counter{font:800 clamp(26px,3vw,38px) "Fraunces";margin-top:.3rem}
.counter span{font:500 14px "Work Sans";color:var(--muted)}
/* where & when */
#timeline{width:100%;height:auto;overflow:visible;margin-top:.6rem}
.ww{display:grid;grid-template-columns:1.25fr 1fr;gap:3vw;align-items:start;margin-top:1rem}
#map{width:100%;max-width:360px;height:auto;overflow:visible;display:block;margin:0 auto}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:14px 16px;min-height:150px}
.card .yr{font:800 30px "Fraunces"}
.card p{font-size:14.5px;margin-top:4px}
.card .src{font-size:11.5px;color:var(--muted);margin-top:8px}
.podium{display:flex;gap:6px;align-items:flex-end;margin-top:10px}
.podium div{flex:1;text-align:center;font-size:12px;font-weight:600;color:#fff;border-radius:4px 4px 0 0;padding:4px 2px}
/* cities */
.cc{display:grid;grid-template-columns:1.1fr 1fr;gap:3vw;align-items:start;margin-top:1rem}
#matrix{width:100%;height:auto;overflow:visible}
.scenes{display:grid;grid-template-columns:1fr;gap:8px}
.scene{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;background:#fff8;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.scene svg{width:110px;height:62px;overflow:visible}
.scene b{font:600 14.5px "Work Sans"}
.scene .s1{font-size:13px}
.scene .s2{font-size:12px;color:var(--muted)}
.cityname{font:800 28px "Fraunces";margin-bottom:6px}
@keyframes fly{0%{transform:translate(-40px,6px)}50%{transform:translate(10px,-6px)}100%{transform:translate(60px,4px)}}
@keyframes flyo{0%,100%{opacity:0}15%,80%{opacity:1}}
.flying{animation:fly 3.2s linear infinite,flyo 3.2s linear infinite}
@keyframes bobb{50%{transform:translateY(-3px)}}
.bob{animation:bobb 1.6s ease-in-out infinite}
@keyframes note{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(10px,-22px);opacity:0}}
.note1{animation:note 2s infinite}.note2{animation:note 2s .7s infinite}
@keyframes heart{50%{transform:scale(1.25)}}
.heart{animation:heart 1.2s infinite;transform-box:fill-box;transform-origin:center}
/* months */
.mm{display:grid;grid-template-columns:1.35fr 1fr;gap:3vw;align-items:center;margin-top:1rem}
#months{width:100%;height:auto;overflow:visible}
.scrub{display:flex;align-items:center;gap:12px;margin:.8rem 0}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:14px;cursor:pointer;flex:none}
input[type=range]{flex:1;accent-color:var(--ink)}
.bigscene{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:16px;text-align:center}
.bigscene svg{width:100%;max-width:300px;height:170px;overflow:visible}
.bigscene .m{font:800 34px "Fraunces"}
.bigscene p{font-size:15px;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:.6rem}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:13px;height:13px;border-radius:2px;display:inline-block}
/* verdict */
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:2rem}
.verdict div{border-top:3px solid var(--ink);padding-top:10px}
.verdict b{font:800 22px "Fraunces";display:block;margin-bottom:4px}
.big{font:800 clamp(48px,7vw,96px) "Fraunces";line-height:.95;margin-top:2.4rem;text-align:center}
footer{padding:4vh 6vw 6vh;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
footer a{color:var(--muted)}
@media (max-width:900px){.ww,.cc,.mm,.verdict{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}nav{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- journey additions ---- */
section{padding-top:13vh}
#route{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(246,241,231,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);transform:translateY(-100%);transition:transform .5s}
#route.show{transform:none}
#route svg{width:100%;height:58px;display:block}
#route .stop{cursor:pointer}
nav{display:none}
.flight{min-height:62vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6vh 4vw;overflow:hidden;position:relative}
.flight svg{width:100%;max-width:1200px;height:230px;overflow:visible}
.flight .cap{font:800 clamp(28px,4vw,52px) "Fraunces";margin-top:.4rem}
.flight .cap small{display:block;font:500 15px "Work Sans";color:var(--muted);margin-top:6px}
.flight .fb{transition:transform 4.5s cubic-bezier(.35,.1,.25,1)}
.chapter{font:800 12.5px "Work Sans";letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;display:flex;gap:10px;align-items:center}
.chapter i{font-style:normal;background:var(--ink);color:var(--paper);border-radius:20px;padding:3px 10px}
.why{display:flex;gap:14px;align-items:center;margin:1rem 0 .4rem;padding:12px 16px;border-left:4px solid var(--ink);background:#fff8;max-width:760px;font-size:15px}
.why b{font-family:"Fraunces";font-size:18px}
/* microscope */
.codes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:1.1rem}
.code{border:1.5px solid var(--line);background:#fff8;border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;font-family:inherit;color:inherit;transition:.2s}
.code b{display:block;font:800 20px "Fraunces"}
.code small{font-size:11px;color:var(--muted)}
.code.on{border-color:var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink)}
.code .lv{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.scope{display:grid;grid-template-columns:1fr 1.1fr 1.1fr;gap:24px;margin-top:12px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:18px 20px;align-items:center}
.scope .lab{font:600 11px "Work Sans";letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.scope h3{font:800 30px "Fraunces";margin:2px 0}
.scope p{font-size:14px}
.hb{display:grid;grid-template-columns:78px 1fr 92px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.hb .t{height:12px;background:var(--paper2);border-radius:6px;overflow:hidden}.hb .f{height:100%;border-radius:6px;transition:width .6s}
.hb .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
/* vote */
.vote{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:1rem}
.vbtn{border:1.5px solid var(--line);background:#fff8;border-radius:12px;padding:10px;cursor:pointer;text-align:center;font-family:inherit;color:inherit;transition:.25s}
.vbtn svg{width:70px;height:46px;overflow:visible}
.vbtn b{display:block;font:600 14px "Work Sans"}
.vbtn .rk{font:800 24px "Fraunces";min-height:28px}
.vbtn.mine{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.vres{font-size:16px;margin-top:.9rem;min-height:2.6em}
.vres b{font-family:"Fraunces";font-size:20px}
/* sankey */
.guess{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:1rem 0 .3rem;padding:13px 18px;border:1.5px dashed var(--so);border-radius:12px;max-width:780px}
.guess .q{font:600 15.5px "Work Sans";flex:1 1 260px}
.guess input{flex:1 1 200px;accent-color:var(--so)}
.guess .gv{font:800 30px "Fraunces";color:var(--so);min-width:3ch}
.reveal{background:var(--so);color:#fff;border:0;border-radius:30px;padding:9px 18px;font:600 14px "Work Sans";cursor:pointer}
.verdictline{font-size:16.5px;min-height:1.6em;margin:.2rem 0}
.verdictline b{font:800 21px "Fraunces"}
#flow{width:100%;height:auto;overflow:visible}
/* map */
.amap{display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:center;margin-top:1rem}
.bigstat{font:800 clamp(40px,5vw,64px) "Fraunces";line-height:1}
/* radar */
.radar{display:grid;grid-template-columns:1.1fr 1fr;gap:3vw;align-items:center;margin-top:.8rem}
#radar{width:100%;max-width:470px;height:auto;overflow:visible;display:block;margin:0 auto}
.rcard{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:18px 20px}
.rcard .lab{font:600 11px "Work Sans";letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rcard .n{font:800 64px "Fraunces";line-height:1}
.rcard .sh{font:600 17px "Work Sans";margin-top:6px}
.rcard p{font-size:13px;color:var(--muted);margin-top:8px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:.9rem}
.ctl input{width:220px;accent-color:var(--ink)}
.ctl .mon{font:800 22px "Fraunces";min-width:6ch}
/* recap */
.recap{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:1.6rem}
.recap div{border-top:3px solid var(--ink);padding-top:8px;font-size:13.5px}
.recap b{display:block;font:800 16px "Fraunces";margin-bottom:3px}
.recap span{font:700 11px "Work Sans";letter-spacing:.14em;color:var(--muted)}
@media (max-width:900px){.codes,.vote{grid-template-columns:repeat(3,1fr)}.scope,.amap,.radar,.recap{grid-template-columns:1fr}}


html,body{min-height:100%}
body::before{display:none}
body{background-image:radial-gradient(#E9E1D0 1px,transparent 1.2px);background-size:14px 14px}
.rv{opacity:1!important;transform:none!important}
section{min-height:100vh;padding:5vh 5vw}
#hero{min-height:100vh;justify-content:center}</style></head><body>
<section id="hero"><div class="wrap">
  <div class="case">A journey through <span id="hTotal"></span> Alberta bird-atlas records</div>
  <h1 class="rv">Five birds ran for Canada's national bird.<br>Only four raise their young in Alberta.</h1>
  <svg id="flock" class="rv d1" viewBox="0 0 1000 340" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="scroll">Tap a coloured bird to meet it · then scroll to fly along ↓</div>
</div></section>
<script>
const D={total:13796,nomonth:676,birds:{"Gray Jay": {"ev": [730, 569, 188, 634]}, "Black-capped Chickadee": {"ev": [2411, 1381, 519, 773]}, "Canada Goose": {"ev": [1968, 536, 659, 1364]}, "Common Loon": {"ev": [728, 468, 374, 333]}, "Snowy Owl": {"ev": [161, 0, 0, 0]}}};
const B=[{k:"Gray Jay",id:"gj",c:"#4F64A8",s:"Gray Jay"},{k:"Black-capped Chickadee",id:"bc",c:"#D9733B",s:"Chickadee"},{k:"Canada Goose",id:"cg",c:"#7B5A3A",s:"Canada Goose"},{k:"Common Loon",id:"cl",c:"#2E7D6B",s:"Common Loon"},{k:"Snowy Owl",id:"so",c:"#4FAFD8",s:"Snowy Owl"}];
B.forEach(b=>b.d=D.birds[b.k]);
const EC=["#DCD5C7","#BDB4A3","#8F8778"],EN=["Just seen","Possible","Probable","Confirmed"];
const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MF=["January","February","March","April","May","June","July","August","September","October","November","December"];
const NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const txt=(p,x,y,s,o={})=>{const t=el("text",Object.assign({x,y,"font-family":"Work Sans","font-size":13,fill:"#857D70"},o),p);t.textContent=s;return t};
const fmt=n=>n.toLocaleString("en-CA"),sum=a=>a.reduce((x,y)=>x+y,0);
const TOTAL=D.total;
function pills(box,items,onPick,start){const bs=items.map((b,i)=>{const t=document.createElement("button");t.className="pill";t.textContent=b.s;t.style.borderColor=b.c;t.onclick=()=>pick(i);box.appendChild(t);return t});
  function pick(i){bs.forEach((t,k)=>{t.classList.toggle("on",k===i);t.style.background=k===i?items[k].c:"";t.style.color=k===i?"#F6F1E7":""});onPick(i)}pick(start||0);return pick}

/* ---------- shared glyphs ---------- */
const BIRD="M-16 4 C-16 -5 -9 -11 -1 -11 C2 -16 9 -16 11 -11 L17 -9 L11 -7 C12 1 7 8 -2 9 L-12 14 L-10 8 C-14 8 -16 6 -16 4 Z";
const WING="M-16 2 C-10 -14 4 -20 12 -12 C2 -8 -6 -2 -16 2Z";
const birdSVG=(c,s=1,x=0,y=0,flip=false)=>`<g transform="translate(${x},${y}) scale(${flip?-s:s},${s})"><path d="${BIRD}" fill="${c}"/><circle cx="6" cy="-10" r="1.6" fill="#F6F1E7"/></g>`;
const flyerSVG=(c,s=1)=>`<g transform="scale(${s})"><path d="${BIRD}" fill="${c}"/><path d="${WING}" fill="${c}" opacity=".75"/><circle cx="6" cy="-10" r="1.6" fill="#F6F1E7"/></g>`;
const branch=`<path d="M-50 22 Q0 16 50 24" stroke="#A88F6B" stroke-width="3" fill="none" stroke-linecap="round"/>`;

document.getElementById("hTotal").textContent=fmt(D.total);
(function(){const s=document.getElementById("flock");
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<46;i++){const x=40+rnd()*920,y=30+rnd()*230,sc=.6+rnd()*.7;
    const g=el("g",{transform:`translate(${x},${y})`},s);const inner=el("g",{style:`animation:drift ${5+rnd()*5}s ease-in-out ${-rnd()*5}s infinite`},g);inner.innerHTML=flyerSVG("#CFC6B6",sc)}
  const pos=[[180,250],[340,210],[500,260],[660,215],[830,120]];
  B.forEach((b,i)=>{const [x,y]=pos[i];const g=el("g",{class:"fin",transform:`translate(${x},${y})`,style:"cursor:pointer"},s);
    const inner=el("g",{style:`animation:drift ${6+i}s ease-in-out infinite`},g);inner.innerHTML=flyerSVG(b.c,2.2);
    txt(g,0,44,b.s,{"text-anchor":"middle","font-size":15,"font-weight":600,fill:b.c});const det=txt(g,0,62,"",{"text-anchor":"middle","font-size":12.5,fill:"#24211C"});
    g.addEventListener("click",()=>{const t=sum(b.d.ev),c=b.d.ev[3];det.textContent=`${fmt(t)} records · ${fmt(c)} prove breeding`;
      if(c){inner.style.animation="none";inner.innerHTML=`<path d="M-30 18 Q0 44 30 18 Z" fill="#C9B79A"/>`+[-10,0,10].map(x=>`<ellipse cx="${x}" cy="20" rx="5" ry="6.5" fill="${b.c}"/>`).join("")+birdSVG(b.c,1.6,0,4)}
      else{inner.style.transition="transform 2.5s ease-in";inner.style.animation="none";requestAnimationFrame(()=>inner.style.transform="translate(220px,-160px)");det.textContent+=" · flies back north"}});
  });
})();


</script></body></html>
