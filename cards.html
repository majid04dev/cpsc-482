<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step cards (icons only)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#F6F1E7;overflow:hidden}
.row{display:grid;grid-template-columns:repeat(4,272px);gap:8px;height:100%;padding:2px 0 4px}
.card{display:flex;align-items:center;justify-content:flex-end;border:1.5px solid #DDD4C3;border-radius:10px;padding:0 10px 0 0;background:#F6F1E7}
.card img{width:72px;height:45px;display:block}
</style></head><body>
<div class="row">
<div class="card"><img src="step1_seen_animated.gif" alt=""></div>
<div class="card"><img src="step2_possible_animated.gif" alt=""></div>
<div class="card"><img src="step3_probable_animated.gif" alt=""></div>
<div class="card"><img src="step4_confirmed_animated.gif" alt=""></div>
</div></body></html>
