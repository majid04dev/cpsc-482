<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vote cards (icons only)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#F6F1E7;overflow:hidden}
.row{display:grid;grid-template-columns:repeat(5,216px);gap:10px;height:100%;padding:2px 0 4px}
.card{display:flex;align-items:center;justify-content:flex-end;border:1.5px solid #DDD4C3;border-radius:10px;padding:0 6px 0 0;background:#F6F1E7}
.card img{width:96px;height:60px;display:block}
</style></head><body>
<div class="row">
<div class="card"><img src="vote_gray_jay.gif" alt=""></div>
<div class="card"><img src="vote_chickadee.gif" alt=""></div>
<div class="card"><img src="vote_canada_goose.gif" alt=""></div>
<div class="card"><img src="vote_common_loon.gif" alt=""></div>
<div class="card"><img src="vote_snowy_owl.gif" alt=""></div>
</div></body></html>
